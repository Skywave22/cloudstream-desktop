name: Build desktop applications

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: .\gradlew.bat check

      - name: Build Windows packages
        run: .\gradlew.bat :desktop:packageExe :desktop:createDistributable

      - name: Zip portable application
        shell: pwsh
        run: |
          Set-Location desktop/build/compose/binaries/main/app
          7z a -tzip CloudStreamDesktop-Windows-Portable.zip CloudStreamDesktop

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDesktop-Windows-Installer
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Upload Windows portable application
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDesktop-Windows-Portable
          path: desktop/build/compose/binaries/main/app/CloudStreamDesktop-Windows-Portable.zip
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux build and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot dpkg-dev xvfb libgtk-3-0t64 libasound2t64

      - name: Run tests
        run: ./gradlew check

      - name: Build Linux packages
        run: ./gradlew :desktop:packageDeb :desktop:createDistributable

      - name: Verify Debian metadata
        shell: bash
        run: |
          deb=$(find desktop/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' -print -quit)
          dependencies=$(dpkg-deb --field "$deb" Depends)
          grep -q 'libgtk-3-0' <<< "$dependencies"
          grep -q 'libasound2' <<< "$dependencies"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          dpkg-deb --raw-extract "$deb" "$work"
          grep -R -q '^StartupWMClass=com-cloudstream-desktop-MainKt$' "$work" --include='*.desktop'

      - name: Smoke-test application startup
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=5s 20s \
            desktop/build/compose/binaries/main/app/CloudStreamDesktop/bin/CloudStreamDesktop \
            > smoke-test.log 2>&1
          status=$?
          set -e
          cat smoke-test.log
          if grep -Eq 'Exception in thread|NoClassDefFoundError|UnsatisfiedLinkError' smoke-test.log; then
            echo 'Application logged a fatal startup exception' >&2
            exit 1
          fi
          if [[ $status -ne 124 && $status -ne 143 ]]; then
            echo "Application exited unexpectedly with status $status" >&2
            exit 1
          fi

      - name: Archive portable application
        run: |
          cd desktop/build/compose/binaries/main/app
          tar -czf CloudStreamDesktop-Linux-Portable.tar.gz CloudStreamDesktop

      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDesktop-Linux-Deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux portable application
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDesktop-Linux-Portable
          path: desktop/build/compose/binaries/main/app/CloudStreamDesktop-Linux-Portable.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew check

      - name: Build macOS packages
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable

      - name: Zip portable application
        run: |
          cd desktop/build/compose/binaries/main/app
          ditto -c -k --sequesterRsrc --keepParent CloudStreamDesktop.app CloudStreamDesktop-macOS-Portable.zip

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDesktop-macOS-DMG
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS portable application
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamDesktop-macOS-Portable
          path: desktop/build/compose/binaries/main/app/CloudStreamDesktop-macOS-Portable.zip
          if-no-files-found: error
