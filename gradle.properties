# Compile the library in one process. Running separate Gradle and Kotlin daemons
# can exceed memory limits on developer machines and ephemeral CI runners.
org.gradle.jvmargs=-Xmx850m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# WiX 3 is preinstalled on the GitHub Windows runner and configured through
# WIX_PATH. Never use the Compose plugin's flaky network downloadWix task.
compose.desktop.application.downloadWix=false
