# Compile the library in one process. Running separate Gradle and Kotlin daemons
# can exceed memory limits on developer machines and ephemeral CI runners.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
